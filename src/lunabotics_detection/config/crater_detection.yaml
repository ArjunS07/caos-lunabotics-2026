crater_detector_node:
  ros__parameters:
    depth_drop_threshold: 0.05      # metres below ground plane to count as crater interior
    min_crater_radius_m: 0.05       # ~10 cm min diameter
    max_crater_radius_m: 0.25       # ~50 cm max diameter per rulebook
    processing_rate: 5.0            # Hz
    depth_avg_frames: 3             # temporal average window
    output_frame: camera_depth_optical_frame
